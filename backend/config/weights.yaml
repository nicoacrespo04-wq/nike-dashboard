# ============================================================
# Configuración central de scoring.
# NINGÚN peso debe estar hardcodeado en las funciones.
# Todos los servicios leen desde acá vía app.config.get_config().
# ============================================================

version: "1.0.0"

# ── COMPETITIVE MATCH SCORE (0..100) ────────────────────────
# score = 100 * sum(w_i * s_i para factores disponibles) / sum(w_i disponibles)
# Los factores sin datos NO penalizan: se excluyen y se renormaliza el peso.
competitive_match:
  weights:
    visual:           0.15
    semantic:         0.25
    price:            0.15
    retailer_overlap: 0.10
    editorial:        0.15
    social:           0.10
    reviews:          0.10

  # Ajuste por evidencia (shrinkage bayesiano).
  #
  # `combine()` renormaliza sobre los factores con datos, y eso es correcto para
  # NO castigar a un producto por tener el catálogo incompleto. Pero al RANKEAR
  # pares entre sí, ese mismo mecanismo premia la ignorancia: un par sin datos
  # editoriales ni sociales se evalúa sólo con los factores fáciles (semantic y
  # price, altos entre dos zapatillas de running cualesquiera) y termina por
  # encima de un par con rivalidad documentada, cuya evidencia real puntúa en
  # valores medios. Eso invierte el propósito del motor.
  #
  # Solución: el score crudo se conserva intacto para la explicación
  # ("de lo que pudimos medir, se parecen un 77%") y el ranking usa un score
  # ajustado que arrastra hacia un prior neutro en proporción a lo que NO se
  # pudo medir:
  #     ajustado = crudo * cobertura + prior * (1 - cobertura)
  # Con cobertura 1.0 ambos coinciden. Poner `enabled: false` para desactivarlo.
  evidence_shrinkage:
    enabled: true
    prior: 0.35

  # Umbral de score para persistir un match (evita explosión combinatoria)
  min_score_to_persist: 35.0
  # Top-N competidores a guardar por producto Nike
  top_n_per_product: 10

  # Confianza según cobertura = suma de pesos con datos reales
  confidence_thresholds:
    high:   0.70
    medium: 0.45
    # por debajo de medium => LOW

  # Sub-parámetros por factor
  price:
    # Similitud de precio: 1 - min(1, |gap| / tolerance)
    gap_tolerance_pct: 40.0
    # Peso relativo entre comparar MSRP vs precio actual vs banda
    sub_weights:
      msrp:           0.40
      current_price:  0.35
      price_band:     0.25

  semantic:
    # Peso de los campos de taxonomía en el score semántico determinístico.
    #
    # ── `category` es CANÓNICO, `sport` es su ALIAS ──────────────────────
    # Son el mismo concepto de negocio (la categoría deportiva: running,
    # football, basketball, training, tennis, lifestyle…). Ponderarlos por
    # separado contaba la MISMA señal dos veces: 0.25 del peso semántico
    # (0.15 + 0.10) para una sola dimensión. Peor todavía: hasta la
    # unificación, `products.category` guardaba en realidad la DIVISIÓN
    # (footwear/apparel), constante en un corpus de calzado, así que esos
    # 0.15 valían 1.0 en el 100% de los pares — peso puro de inflación.
    #
    # Ahora `category` concentra el peso de la dimensión y `sport` queda en
    # 0.0: la columna sigue existiendo y `enrichment` la mantiene
    # sincronizada, pero NO vuelve a sumar. Es 0.0, no borrada, para que
    # cualquiera que lea esta config vea explícito que el alias existe y
    # está deliberadamente sin peso.
    #
    # ── `division` es nueva ──────────────────────────────────────────────
    # FW / AP / EQ. Peso BAJO a propósito: es una dimensión de 3 valores,
    # así que en un catálogo de calzado vale 1.0 casi siempre y un peso alto
    # sería otra vez inflación. El veto real ("dos divisiones distintas no
    # compiten") corresponde a `hard_mismatch`, no a un peso grande.
    # Los 0.05 salen de `text_similarity`: es la única señal DERIVADA
    # (TF-IDF/embeddings de la descripción) y no debía pesar más que la
    # taxonomía declarada del negocio.
    #
    # Suma = 1.00 (informativo: `_blend` renormaliza sobre los campos con datos).
    field_weights:
      use_case:                 0.30
      category:                 0.25   # CANÓNICO (categoría deportiva)
      division:                 0.05   # FW|AP|EQ
      performance_vs_lifestyle: 0.10
      gender:                   0.10
      subcategory:              0.05
      sport:                    0.00   # ALIAS de `category`: no cuenta dos veces
      text_similarity:          0.15   # embeddings/TF-IDF de descripción
    # Si dos productos no comparten gender, category o division, el score se atenúa.
    # (`division` entra en el veto en cuanto `matching._score_semantic` la
    # incorpore; ver backend/docs/taxonomy.md § "cambios pendientes".)
    hard_mismatch_penalty: 0.45

  visual:
    sub_weights:
      embedding:   0.50   # CLIP/SigLIP si está disponible
      silhouette:  0.20
      colors:      0.15
      materials:   0.15
    # Fracción mínima del peso visual que debe tener datos para que el factor
    # sea creíble. Sin esto, un par cuya única señal es la etiqueta de silueta
    # puntúa 0.0 ("visualmente distintos") con peso completo, cuando en
    # realidad no hay evidencia visual: dos vocabularios de enrichment que
    # dicen "trainer" y "runner" sobre la misma silueta bastan para hundir el
    # match. Por debajo del umbral el factor se marca sin datos y se renormaliza.
    #
    # 0.35 = silhouette (0.20) + materials (0.15). Deja afuera la silueta sola
    # (0.20), que era el problema real. OJO: estuvo en 0.40 y eso APAGÓ el
    # factor en el 100% de los pares — sin CLIP el techo de evidencia es 0.35.
    # Lo detectó `python -m app.calibration`; correrlo después de cambiar esto.
    # Con imágenes reales el sub-peso `embedding` (0.50) entra en juego y este
    # piso se puede subir.
    min_evidence_weight: 0.35

  editorial:
    # Puntos por tipo de mención, saturados con log
    mention_type_scores:
      versus:      1.00
      alternative: 0.85
      same_list:   0.45
      ranking:     0.40
      review:      0.15
    saturation_k: 4.0     # score = 1 - exp(-puntos / k)
    recency_half_life_days: 365

  social:
    saturation_k: 25.0    # sobre co-menciones del período
    recency_half_life_days: 180
    min_comentions: 2

  reviews:
    # Similitud de atributos valorados extraídos de reviews (Jaccard ponderado)
    min_reviews_for_signal: 3
    rating_weight: 0.25   # parte del score que aporta la cercanía de rating

# ── BUSINESS IMPORTANCE SCORE (0..100) ──────────────────────
# importance = 100 * gate * sum(w_i * s_i) / sum(w_i)
# donde gate = relevancia competitiva (un gap sin competencia real no importa)
business_importance:
  weights:
    competitive_relevance:  0.20   # match score del competidor principal
    franchise_importance:   0.12   # peso de la franquicia (ver franchise_importance)
    revenue_proxy:          0.12   # SKUs × cobertura × precio
    retailer_importance:    0.10   # importancia de los retailers involucrados
    market_coverage:        0.08   # en cuántos retailers está presente
    price_gap:              0.10   # magnitud del gap de precio
    review_volume:          0.08
    social_momentum:        0.08
    editorial_momentum:     0.05
    share_of_shelf:         0.04
    promo_intensity:        0.03

  # ── Gate de relevancia competitiva ──────────────────────
  # gate = clamp(competitive_relevance / gate_full_relevance, gate_floor, 1.0)
  #
  # El gate apaga lo que no tiene competencia real: un gap de precio contra
  # nadie no es una oportunidad. Es un VETO de la cola baja, no un impuesto
  # permanente.
  #
  # Antes era `clamp(competitive_relevance, gate_floor, 1.0)`, es decir una
  # multiplicación que NUNCA llegaba a 1: como `competitive_relevance =
  # match_score/100` y el mejor match del corpus es 75, la importancia tenía un
  # techo estructural de ~82 con los 11 factores en 1.0 — y el máximo observado
  # era 56. CRITICAL (62) era inalcanzable por construcción, no por falta de
  # casos graves. Además contaba la relevancia dos veces: `competitive_relevance`
  # ya es uno de los 11 factores ponderados (w=0.20).
  #
  # `gate_full_relevance` = relevancia a partir de la cual el competidor se
  # considera real y el gate deja de atenuar. 0.60 no es un percentil: es el
  # mismo match_score que el motor ya usa como "comparable suficiente para
  # actuar" en `opportunities.premiumization_opportunity.min_match_score`.
  # Poner 0 (o borrar la clave) restaura el multiplicador puro histórico.
  gate_floor: 0.35
  gate_full_relevance: 0.60

  # Cortes de severidad sobre la escala 0..100 de business_importance, leída
  # como "qué fracción de la relevancia de negocio expresable alcanza este
  # caso". NO son percentiles del dataset: una severidad definida como "el top
  # 10%" no informa nada, sólo re-etiqueta un ranking y siempre tiene la misma
  # forma pase lo que pase en el mercado. Son fracciones de la escala:
  #     CRITICAL >= 78  ~ casi todo el peso de negocio alineado
  #     HIGH     >= 60  ~ más de la mitad
  #     MEDIUM   >= 40  ~ un tercio largo
  # Son los mismos cortes que `common.severity_from_score` trae por defecto:
  # es el diseño original del score. Se habían bajado a 62/50/35 para compensar
  # una escala que el gate multiplicativo topeaba en ~56 observado; arreglado el
  # gate (ver gate_full_relevance), la escala vuelve a usarse entera y los
  # cortes de diseño vuelven a tener masa en las cuatro bandas.
  # Verificar siempre con `python -m app.calibration` (sección 2).
  severity_thresholds:
    critical: 78.0
    high:     60.0
    medium:   40.0
    # por debajo => LOW

  # Importancia por franquicia (0..1). Default para las no listadas.
  franchise_importance:
    default:      0.45
    Pegasus:      0.95
    Vomero:       0.80
    Structure:    0.65
    Invincible:   0.75
    "Air Force 1": 0.95
    "Air Max":    0.90
    Dunk:         0.85
    Jordan:       0.95
    Mercurial:    0.85
    Phantom:      0.70
    Metcon:       0.60
    "Free Run":   0.50

  # Importancia por etapa de ciclo de vida
  lifecycle_multiplier:
    launch:    1.10
    growth:    1.15
    mature:    1.00
    decline:   0.80
    clearance: 0.65

# ── RETAIL MEDIA OPPORTUNITY SCORE (0..100) ─────────────────
# Objetivo: decidir cuándo conviene invertir en visibilidad en vez de descuento.
retail_media:
  weights:
    nike_stock_health:      0.20   # stock/disponibilidad Nike alta => más score
    price_competitiveness:  0.20   # Nike ya competitivo en precio => más score
    competitive_relevance:  0.15   # match score con el competidor
    business_importance:    0.15
    competitor_momentum:    0.12   # social + editorial + reviews del competidor
    shelf_gap:              0.10   # bajo share of shelf Nike => oportunidad
    competitor_stock_gap:   0.08   # competidor con quiebre => capturar demanda

  thresholds:
    # Nike se considera "competitivo en precio" si el gap está dentro de esta banda
    price_competitive_pct:     5.0
    price_disadvantage_pct:    12.0   # por encima => evaluar precio antes que media
    nike_stock_high_pct:       70.0
    nike_stock_low_pct:        35.0
    competitor_stockout_pct:   40.0
    high_momentum:             0.60
    min_score_to_report:       45.0

  confidence_thresholds:
    high:   0.70
    medium: 0.45

# ── OPPORTUNITY ENGINE ──────────────────────────────────────
opportunities:
  # Umbrales de disparo por regla. Cada regla produce 0..N oportunidades.
  price_competitiveness_risk:
    min_competitor_cheaper_pct: 10.0
    min_retailers:              2
  over_discounting_risk:
    min_discount_gap_pp:        8.0     # Nike descuenta X pp más que comparables
    max_price_disadvantage_pct: 3.0     # ...pese a estar ya competitivo
  full_price_opportunity:
    max_competitor_cheaper_pct: 2.0
    min_nike_discount_pct:      10.0
  assortment_gap:
    min_sku_ratio:              2.0     # competidores/Nike SKUs en el segmento
    min_competitor_skus:        6
  distribution_gap:
    min_retailer_coverage_gap:  2       # retailers donde está el competidor y Nike no
  share_of_shelf_risk:
    min_shelf_drop_pp:          4.0
  competitor_momentum:
    min_acceleration:           0.35
  competitor_stockout_opportunity:
    max_competitor_availability_pct: 40.0
    min_nike_availability_pct:       70.0
  assortment_white_space:
    min_demand_signal:          0.50
    max_nike_share:             0.25
  premiumization_opportunity:
    # Calibrado contra la escala AJUSTADA POR EVIDENCIA (ver
    # competitive_match.evidence_shrinkage): un par con cobertura parcial rinde
    # menos que en la escala cruda, así que 70 dejaba la regla muerta.
    min_match_score:            60.0
    min_nike_cheaper_pct:       8.0
  promotional_pressure:
    min_competitors_on_markdown: 2
    min_avg_discount_pct:        20.0
  product_launch_threat:
    max_days_since_launch:      120
    min_retailer_coverage:      2

  # Familia por tipo (para agrupar en el frontend)
  families:
    price_competitiveness_risk:      pricing
    over_discounting_risk:           pricing
    full_price_opportunity:          pricing
    # La contracara de full_price: mismo eje de decisión (qué hacer con el
    # precio de ESE stylecolor), resultado opuesto. Van juntas en `pricing`
    # para que quien mira decisiones de precio vea las dos caras.
    clearance_needed:                pricing
    premiumization_opportunity:      pricing
    promotional_pressure:            pricing
    assortment_gap:                  assortment
    assortment_white_space:          assortment
    distribution_gap:                distribution
    share_of_shelf_risk:             distribution
    competitor_stockout_opportunity: stock
    competitor_momentum:             competitive_threat
    product_launch_threat:           competitive_threat

# ── BRAND / CONSUMER INTELLIGENCE (Argentina) ───────────────
brand_intelligence:
  country: AR
  # Ventanas de análisis en días
  current_window_days:  30
  previous_window_days: 30

  momentum:
    # Brand Momentum = volumen normalizado × dirección × aceleración
    weights:
      volume:       0.35
      trend:        0.35
      acceleration: 0.30
    spike_threshold: 0.50    # variación que marca un pico

    # ── escala del factor `volume` (ver backend/docs/signals.md) ──
    # El volumen se mide en LOG contra la MEDIANA del cohorte:
    #     volume = 0.5 + 0.5 * log10(actual / mediana) / log10(volume_decade_ratio)
    # 0.5 = la mediana del cohorte · 1.0 = `volume_decade_ratio` veces la
    # mediana · 0.0 = esa misma proporción por debajo.
    # Antes se normalizaba contra el MÁXIMO del cohorte y eso garantizaba que la
    # entidad más grande valiera SIEMPRE 1.0; con cohortes discretas (una nota
    # editorial por producto => máximo 1) valían 1.0 TODAS, y el panel de
    # momentum mostraba 6 filas empatadas en 100. La mediana no la fija ningún
    # dato en particular y deja recorrido hacia arriba.
    # 10 = una década: en el corpus AR la conversación social por marca abarca
    # ~1,4 décadas (265..6031 menciones), así que una década arriba/abajo de la
    # mediana cubre la dispersión real sin saturar en los extremos.
    volume_decade_ratio: 10.0

    # Volumen mínimo en la ventana de COMPARACIÓN para que una variación
    # relativa sea una medición y no ruido amplificado. Con 1 mención previa,
    # (835-1)/1 = +83.400% no dice nada sobre el mercado: dice que la base era
    # 1. Por debajo de este piso el factor `trend` (y la aceleración, que es su
    # derivada) se marcan NO DISPONIBLES y el momentum se renormaliza sobre los
    # factores que sí se pudieron medir — nunca se rellenan con el máximo.
    # 25 = el mismo orden de magnitud que el piso de emisión de insights: por
    # debajo de eso el motor ya considera que no hay conversación suficiente
    # para afirmar nada.
    min_base_volume: 25

  confidence:
    # ── Confianza de un agregado según su VOLUMEN DE SEÑAL ──
    # Los cortes son de precisión estadística, no percentiles del dataset: el
    # margen de error de una proporción al 95% es ~0.98/sqrt(n).
    #     n >= 1000  =>  ±3,1 pp   -> HIGH
    #     n >=  250  =>  ±6,2 pp   -> MEDIUM
    #     n <   250  =>  peor      -> LOW
    # Estaban en 80/25, por debajo del volumen típico de un insight (mínimo
    # observado 123): los 13 insights salían HIGH y la etiqueta no informaba.
    high_min_volume:   1000
    medium_min_volume: 250

    # Piso ANTI-INVENCIÓN: volumen mínimo para que un insight exista.
    # Es una regla de producto ("no se concluye nada sobre tres comentarios"),
    # NO una afirmación de precisión, y por eso tiene su propia clave: mientras
    # estuvo acoplado a `medium_min_volume`, subir el corte de MEDIUM para que
    # la confianza discriminara borraba insights reales del tablero.
    # Si se borra esta clave, el módulo vuelve a usar `medium_min_volume`.
    min_volume_to_emit: 25

  # Taxonomía de insights. Cada dimensión con sus tópicos.
  taxonomy:
    brand_perception:
      [premium, aspirational, innovative, fashionable, performance,
       accessible, expensive, good_value, exclusive, mainstream]
    product_perception:
      [comfort, quality, design, durability, technology, fit, performance]
    price_perception:
      [expensive, fair_price, overpriced, discounts, value_for_money]
    availability:
      [difficult_to_find, stock_problems, sizing_availability, product_variety]
    cultural_relevance:
      [fashion, music, football, running, gym, streetwear, sneaker_culture]
    consumer_intent:
      [want_to_buy, considering, comparing, recommendation, regret,
       repurchase, switch_brand]

# ── ENRIQUECIMIENTO ─────────────────────────────────────────
enrichment:
  version: "1.1.0"

  # ── BANDAS DE PRECIO EN PLATA ───────────────────────────────
  # La banda YA NO es una etiqueta cualitativa (entry/mid/premium): el
  # nombre de la banda ES el rango en moneda del país. Lo que el negocio
  # quiere ver es el monto, no una gama inventada.
  #
  # Formato: `<label monetario>: [min, max]`, ordenadas de menor a mayor.
  #   · La CLAVE es el label canónico que se guarda en `products.price_band`.
  #   · El ORDEN de las claves define la distancia ordinal entre bandas que
  #     usa `matching._price_band_similarity` (misma mecánica que antes: el
  #     decaimiento por cercanía sigue funcionando sin tocar ese módulo).
  #   · Los montos `[min, max)` son el intervalo real: `min` inclusivo,
  #     `max` exclusivo. `enrichment` los persiste en `price_band_min` /
  #     `price_band_max` para que la UI muestre plata y no una etiqueta.
  #   · El techo de la ÚLTIMA banda es un centinela: se guarda como NULL
  #     (banda abierta) y el label lleva el sufijo `open_top`.
  #
  # CAMBIAR LA CANTIDAD DE BANDAS NO REQUIERE TOCAR CÓDIGO: se agregan o
  # se quitan claves acá. La única regla es que la clave coincida con el
  # label que `enrichment.price_band_label()` deriva de `[min, max]`
  # (lo verifica `tests/test_enrichment.py::test_price_band_keys_are_canonical_labels`,
  # así una banda mal escrita falla en CI en vez de degradar el scoring en silencio).
  price_band_format:
    default: {thousands_sep: "",  open_top: "+", separator: "-", currency_prefix: ""}
    AR:      {thousands_sep: ".", open_top: "+", separator: "-", currency_prefix: ""}
    US:      {thousands_sep: ",", open_top: "+", separator: "-", currency_prefix: ""}

  price_bands:
    AR:
      "0-90.000":        [0,       90000]
      "90.000-160.000":  [90000,   160000]
      "160.000-260.000": [160000,  260000]
      "260.000+":        [260000,  99999999]
    US:
      "0-90":    [0,   90]
      "90-140":  [90,  140]
      "140-200": [140, 200]
      "200+":    [200, 99999]

  # ALIAS LEGACY de las bandas: nombre cualitativo por posición (mismo orden
  # que `price_bands[<país>]`). No se borró la gama: se movió a
  # `products.price_tier`, para no romper a quien todavía razona por
  # entry/mid/premium mientras la UI muestra los montos.
  # Si la lista es más corta que las bandas, las bandas sobrantes quedan sin tier.
  price_band_tiers:
    AR: [entry, mid, premium, super-premium]
    US: [entry, mid, premium, super-premium]

  # ── DIVISIÓN (FW / AP / EQ) ─────────────────────────────────
  # Criterio de normalización REUTILIZADO de `web/src/lib/utils.ts::normalizeDivision`
  # (mismo orden de evaluación: FOOTWEAR/FW -> FW, APP/AP -> AP, EQUIP/EQ -> EQ),
  # extendido con los sinónimos ES que ya usaba `ingest/mapping.py`.
  # `code`: el valor que se guarda en `products.division`.
  # `contains`: subcadenas (sin acentos, mayúsculas) que resuelven a ese código.
  # `exact`: valores que resuelven sólo por igualdad exacta.
  #
  # ÚNICA diferencia con el front: ahí la regla es `includes('FOOT')`, acá es
  # `FOOTWEAR`. El backend corre este normalizador también sobre `category`
  # (para rescatar la división que la ingesta guardaba ahí), y con `FOOT` la
  # categoría **football** caería en FW. `FOOT` queda como coincidencia exacta,
  # así no se pierde ningún valor real de la columna de división.
  division:
    codes:
      FW:
        contains: [FOOTWEAR, CALZADO, ZAPATILLA, SNEAKER, BOTIN, SHOE]
        exact:    [FW, F, FOOT]
      AP:
        contains: [APPAREL, APPARELL, INDUMENTARIA, ROPA, VESTIMENTA, TEXTIL]
        exact:    [AP, A, APP]
      EQ:
        contains: [EQUIP, ACCESOR, ACCESSOR]
        exact:    [EQ, E]
    # Fallback por texto cuando NO hay columna de división: keywords que
    # alcanzan para afirmar la división del producto. Sólo se usa si hay
    # evidencia; si no hay, `division` queda NULL (no se inventa).
    text_evidence:
      AP: [camiseta, camisetas, remera, jersey, short, shorts, pantalon, campera,
           buzo, hoodie, medias, calza, top deportivo, indumentaria, chaqueta,
           conjunto, musculosa, sujetador deportivo]
      EQ: [pelota, balon, mochila, bolso, guantes, botella, canillera, gorra,
           accesorio, accesorios, equipamiento, banda elastica, colchoneta]
      FW: [zapatilla, zapatillas, botin, botines, calzado, sneaker, sneakers,
           shoe, shoes, sandalia, ojota, running shoe]

  lifecycle:
    # Días desde launch_date
    launch_max_days:  90
    growth_max_days:  270
    mature_max_days:  540
    decline_max_days: 900
    # más allá => clearance
    # Un descuento sostenido alto fuerza clearance
    clearance_discount_pct: 40.0

# ── EMBEDDINGS / MODELOS LOCALES ────────────────────────────
# Restricción dura: NADA de LLMs cloud. Sólo local o determinístico.
embeddings:
  text:
    # 'sentence-transformers' si está instalado; si no, fallback TF-IDF (sklearn)
    backend: auto            # auto | sentence_transformers | tfidf
    model:   sentence-transformers/all-MiniLM-L6-v2
  image:
    backend: auto            # auto | clip | attribute_fallback
    model:   openai/clip-vit-base-patch32
  cache_dir: .cache/embeddings
